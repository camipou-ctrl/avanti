<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RE/MAX Avanti</title>
<meta name="description" content="Panel de negociaciones, cuadro, análisis y flujo de RE/MAX Avanti.">
<meta name="theme-color" content="#0b2a5b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Avanti">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/favicon-32.png" sizes="32x32">
<link rel="icon" href="iconos/icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #0b2a5b; overflow: hidden; }
  body { padding-top: env(safe-area-inset-top); box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: #f3f5f9; }
  .portada { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #fff; background: #0b2a5b; transition: opacity .3s; z-index: 2; }
  .portada img { width: 84px; height: 84px; border-radius: 20px; }
  .portada.fuera { opacity: 0; pointer-events: none; }
  .spin { width: 26px; height: 26px; border: 3px solid rgba(255,255,255,.25); border-top-color: #fff; border-radius: 50%; animation: g .8s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  .sin-red { display: none; text-align: center; padding: 0 24px; line-height: 1.4; }
  .sin-red button { margin-top: 12px; padding: 10px 18px; border-radius: 10px; border: 0; background: #d81e34; color: #fff; font-weight: 600; font-size: 15px; }
</style>
</head>
<body>
<div class="portada" id="portada">
  <img src="iconos/icono-192.png" alt="">
  <div class="spin" id="spin"></div>
  <div class="sin-red" id="sinRed"><b>Sin conexión</b><br>Revisa el internet y vuelve a intentar.<br><button onclick="location.reload()">Reintentar</button></div>
</div>
<iframe id="app" title="RE/MAX Avanti" allow="clipboard-write" src="https://script.google.com/macros/s/AKfycbwX5cq0Ei2lTNjyZDrv6nU3MRJmI1wVi5w55YiaJVPWA5zV1QHfSMjgfjTei8SNDCo8fg/exec"></iframe>
<script>
  var portada = document.getElementById('portada');
  document.getElementById('app').addEventListener('load', function () { portada.classList.add('fuera'); });
  if (!navigator.onLine) { document.getElementById('spin').style.display = 'none'; document.getElementById('sinRed').style.display = 'block'; }
  setTimeout(function () { portada.classList.add('fuera'); }, 12000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
